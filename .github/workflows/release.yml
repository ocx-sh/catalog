# ============================================================================
# RELEASE LANE — status (historical record + the one remaining owner step)
#
# Bootstrap already done:
#   - The `@ocx-sh` npm org exists.
#   - `@ocx-sh/catalog@0.1.0` was published MANUALLY, once, from a local
#     machine (`npm publish --access public`) with a short-lived, granular
#     automation token that was deleted right after — npm trusted publishing
#     (OIDC, used below) cannot pre-provision a brand-new package name, so the
#     first publish had to be manual. That is history now, not a pending task.
#   - The GitHub remote (github.com/ocx-sh/catalog) exists; branch+PR+merge is
#     the active workflow.
#   - The `v0.1.1` tag was cut but was NOT published to npm — only `0.1.0` is on
#     the registry. (CHANGELOG.md's version notes are the source of truth for
#     what actually shipped.)
#
# THE ONE REMAINING OWNER STEP — until it is done, a `v*` tag push runs the
# `gate` job fine but the `publish` job's OIDC exchange has no publisher to
# authenticate against, so it is inert (fails at publish, publishes nothing):
#   - On npmjs.com, register a Trusted Publisher for `@ocx-sh/catalog` scoped to
#     EXACTLY this repository (ocx-sh/catalog), this workflow file
#     (`.github/workflows/release.yml`), and branch `main`. Trusted-publisher
#     config is per-package (no bulk setting) and, since 2026-05-20, must name
#     the workflow explicitly.
#
# Two standing invariants (not steps — keep them true):
#   - `--provenance` below silently attaches NO attestation unless this
#     repository is PUBLIC on GitHub at the time a tag is pushed. Make the repo
#     public before a provenance-bearing release.
#   - Do NOT add an `NPM_TOKEN` (or any npm auth) secret to this repo for this
#     workflow. Trusted publishing is token-less by design; a stored token here
#     would be a live credential this workflow never reads.
# ============================================================================
name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  # Re-runs the full quality gate against the exact tagged commit — a tag
  # push is not guaranteed to be a commit that already went through ci.yml
  # (e.g. a tag pushed after the fact), so this job never trusts a prior run.
  # It runs the SAME `task` targets ci.yml and a local developer run, for
  # local/CI parity; the checks and their order are unchanged from the
  # pre-task gate (lint, typecheck, test, build, pack-smoke).
  gate:
    name: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          # No dependency cache in the release lane: this workflow publishes
          # runtime artifacts, and a restored cache is a supply-chain write
          # into what gets published (zizmor cache-poisoning, high). CI keeps
          # its cache; a publish run pays the extra install instead.
      - uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e  # v1
      - run: npm ci
      - run: task lint
      - run: task typecheck
      - run: task test
      - run: task build
      - run: task pack-smoke

  publish:
    # The ONE job in this repo that deliberately does NOT run `task` and
    # carries no `setup-ocx` step. Everywhere else local and CI run the
    # identical `task` target — that parity is the point. Here it is traded
    # away on purpose: this job holds
    # the OIDC write permission below, so every tool it provisions is another
    # package that could mint an npm credential during the publish window.
    # `gate` has already run the full `task verify` on this same commit, so the
    # parity this job gives up buys nothing it does not already have, while the
    # smaller tooling surface is real. Same reasoning as the `--ignore-scripts`
    # install below.
    name: publish
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      # id-token: write is the OIDC token trusted publishing exchanges for a
      # short-lived npm publish credential — no NODE_AUTH_TOKEN secret exists
      # or is read anywhere in this job.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          # See the gate job above: no dependency cache in the release lane.
      # --ignore-scripts, and ONLY in this job: this is the one job holding
      # `id-token: write`, so a plain `npm ci` would execute every transitive
      # dependency's install script with ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN in
      # its environment — one compromised dependency could mint the npm
      # publish credential itself (security panel 2026-08-22, W6). The `gate`
      # job above deliberately keeps full install scripts and has no
      # id-token, so a dependency that genuinely needs its install script
      # fails loudly there rather than silently here. Verified: `npm ci
      # --ignore-scripts && npm run build` (tsc + a chmod) produces the same
      # dist/ — nothing in the build path depends on an install script.
      # `npm publish` below still runs this package's OWN prepack/postbuild
      # lifecycle scripts; --ignore-scripts is scoped to the install.
      - run: npm ci --ignore-scripts
      - run: npm run build
      # Trusted publishing needs npm CLI >=11.5.1 (OIDC exchange support).
      # Pinned, not `@latest`: this is the tool that publishes the package,
      # so an unpinned fetch at release time is a supply-chain write into
      # every release (zizmor adhoc-packages). Bump deliberately, like any
      # other pin; Renovate manages it via the same npm datasource.
      - name: Ensure npm supports trusted publishing (OIDC)
        run: |
          set -euo pipefail
          npm install -g npm@11.9.0
          npm --version
      # Dry-run first and fail hard on any silent manifest auto-correction
      # (e.g. npm dropping `bin` with only a warning) — never let that reach
      # a real publish. Ported verbatim from the grim release.yml precedent
      # (research_npm_publish_hygiene.md).
      - name: npm publish --dry-run (auto-correction guard)
        run: |
          set -euo pipefail
          output="$(npm publish --dry-run --provenance --access public 2>&1)"
          echo "$output"
          if grep -q "auto-corrected" <<<"$output"; then
            echo "::error::npm silently auto-corrected the package manifest during --dry-run — treating as a hard failure, not a warning." >&2
            exit 1
          fi
      - name: npm publish
        run: npm publish --provenance --access public
