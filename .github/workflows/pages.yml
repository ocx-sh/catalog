name: pages

# Builds the Starlight documentation site in docs/ and checks it on every pull
# request that touches the docs: `task docs:build`, then `task docs:check`
# (Pagefind bundle present, `ocx-site check`, lychee over the rendered HTML), so
# a dead link fails the PR.
#
# A push to main deploys the docs to https://ocx.sh/apps/catalog/ (`deploy`).
# https://ocx-sh.github.io/catalog/ still serves the LAST MkDocs deployment
# until the owner runs `redirect-stubs` below, after /apps/catalog/ serves.

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/gen-docs-redirects.mjs"
      - "taskfile.yml"
      - "lychee.toml"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/gen-docs-redirects.mjs"
      - "taskfile.yml"
      - "lychee.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      handoff_done:
        description: >-
          redirect-stubs only. Tick ONLY after ocx.sh/apps/catalog/ serves the
          docs: this REPLACES the old GitHub Pages site with redirect stubs.
        type: boolean
        default: false

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"

      - uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e  # v1

      - run: npm ci
        working-directory: docs

      - name: Build docs
        run: task docs:build

      - name: Check docs (Pagefind, ocx-site check, lychee)
        run: task docs:check

      - name: Upload the docs
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: docs
          path: docs/dist

  # https://ocx.sh/apps/catalog/: Bunny storage zone sh-ocx-catalog, through
  # ocx-sh/website's deploy action. Main pushes only (the `ocx.sh` environment
  # admits main alone); the key never reaches the build job.
  deploy:
    name: deploy
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: ocx.sh
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: ocx-sh-deploy
      cancel-in-progress: false
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: docs
          path: dist
      - name: Deploy
        id: deploy
        uses: ocx-sh/website/.github/actions/deploy@1b898a76d4c3bbe60d9619a931c74f21660f4eb4  # v0.1.1
        with:
          dist: dist
          storage-key: ${{ secrets.BUNNY_STORAGE_KEY }}

  # Manual, owner-run, AFTER the website deploy serves /apps/catalog/. Replaces
  # the old MkDocs site on GitHub Pages with one meta-refresh stub per old URL
  # (docs/redirects.json -> scripts/gen-docs-redirects.mjs). Never runs from a
  # pull request or a push; the checkbox guards against a mis-click, because
  # until the hand-off this deployment would delete the only live docs.
  redirect-stubs:
    name: redirect-stubs
    if: github.event_name == 'workflow_dispatch' && inputs.handoff_done
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"

      - name: Generate the redirect stubs
        run: node scripts/gen-docs-redirects.mjs --out "$RUNNER_TEMP/stubs"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: ${{ runner.temp }}/stubs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
