name: pages

# Builds the MkDocs Material documentation site and publishes it to GitHub
# Pages at https://ocx-sh.github.io/catalog/.
#
# `build` runs on every pull request that touches the docs, so a dead internal
# link (mkdocs --strict) fails the PR rather than the deploy. Only a push to
# main uploads the artifact and runs `deploy`.

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "taskfile.yml"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "taskfile.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    # `pages: write`/`id-token: write` are here ONLY so that
    # actions/configure-pages can turn Pages on and select the Actions source
    # on the very first run of this workflow — the repository has no Pages
    # site until then, and `enablement: true` needs those scopes on the job
    # that calls it. Nothing else in this job uses them; the artifact upload
    # needs neither.
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
        with:
          enablement: true

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0

      - uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e  # v1

      - name: Build docs (strict)
        run: task docs:build

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    name: deploy
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
