# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# Canonical local + CI task surface. Every task wraps a plain npm script or an
# ocx-provisioned tool (task/git-cliff/actionlint/lychee/gitleaks, pinned in
# ocx.toml). `task verify` is the local equivalent of the CI quality gate; CI
# runs the identical tasks through `ocx run -- task <name>` so local and CI
# execute the same checks. Node dependencies come from `npm ci` (a CI step, or
# an existing local node_modules) — these tasks do not install them.

version: '3'

tasks:
  default:
    desc: Fast feedback — the full local quality gate
    cmds:
      - task: verify

  verify:
    desc: Full quality gate (lint, typecheck, test+coverage, pack-smoke)
    cmds:
      - task: lint
      - task: typecheck
      - task: test
      - task: pack-smoke

  lint:
    desc: Lint sources (eslint)
    cmds:
      - npm run lint

  typecheck:
    desc: Type-check the CLI/library and the theme (two tsconfig passes)
    cmds:
      - npm run typecheck

  test:
    desc: Run vitest under coverage (100% statements/branches/functions/lines)
    cmds:
      - npm test

  pack-smoke:
    desc: Publish-shape verification (publint, attw, real pack + install smoke)
    cmds:
      - node scripts/pack-smoke.mjs

  build:
    desc: Compile TypeScript to dist/
    cmds:
      - npm run build

  # The docs site is a private Astro/Starlight project in docs/ (own
  # package.json, ocx theme dependency; see docs/astro.config.mjs). docs:* are
  # STANDALONE, deliberately not part of `verify`: they need `npm --prefix docs
  # install` first, and `verify` must stay runnable on the root npm install
  # alone. The pre-merge gate for docs is .github/workflows/pages.yml (build +
  # docs:check on every docs PR).
  docs:build:
    desc: Build the docs site into docs/dist/ (Starlight at /apps/catalog/, Pagefind bundle included)
    cmds:
      - npm --prefix docs run build

  docs:serve:
    desc: Live-reload docs preview (Astro dev server)
    cmds:
      - npm --prefix docs run dev

  docs:clean:
    desc: Remove the generated docs/dist/ and docs/.astro/ directories
    cmds:
      - rm -rf docs/dist docs/.astro

  # The three checks on a built docs/dist: the Pagefind bundle exists,
  # `ocx-site check` (the theme's own build validation, run through the docs
  # package's `check` script because `npx ocx-site --dist` is parsed by npm 11 as
  # an npm flag), and lychee over the rendered HTML.
  #
  # lychee sees the site the way a browser does: dist is mounted under
  # <stage>/apps/catalog so the root-relative `/apps/catalog/...` links resolve,
  # and the absolute https://ocx.sh/apps/catalog/ URLs the theme writes (canonical,
  # sitemap) are remapped onto the same tree, because the site is not live there
  # yet. The excluded paths are the theme chrome's links into OTHER sections of
  # ocx.sh (/docs/, /catalog/, /integrations/, /install/, /apps/): they do not
  # exist in this build. `/404/` is the canonical of 404.html, which the build
  # emits as 404.html only. External links go through lychee.toml as usual.
  # lychee 0.24 cannot resolve a #fragment on a directory-index link, so anchors
  # are not part of this gate.
  docs:check:
    desc: Check a built docs/dist (Pagefind bundle, ocx-site check, lychee over the rendered HTML)
    cmds:
      - test -d docs/dist/pagefind
      - npm --prefix docs run check
      - |
        stage="$(mktemp -d)"
        mkdir -p "$stage/apps"
        ln -s "$PWD/docs/dist" "$stage/apps/catalog"
        lychee --config lychee.toml --root-dir "$stage" \
          --remap "^https://ocx.sh/apps/catalog/ file://$stage/apps/catalog/" \
          --exclude "^file://$stage/(docs|catalog|integrations|install)(/|$)" \
          --exclude "^file://$stage/apps/?$" \
          --exclude "^file://$stage/apps/catalog/404/$" \
          "$stage/apps/catalog"
        rc=$?
        rm -rf "$stage"
        exit $rc

  lint:actions:
    desc: Lint GitHub Actions workflows
    cmds:
      - actionlint

  lint:links:
    desc: Check for broken links (network; may be flaky offline)
    cmds:
      - lychee --cache --max-cache-age 1d .

  # Version-pinned like every other tool here (task/git-cliff/actionlint/
  # lychee/gitleaks via ocx.lock, npm in release.yml, @lhci/cli in
  # package.json). An unpinned `uvx zizmor` would resolve to whatever is
  # latest on PyPI at run time — a security scanner that silently changes
  # its rule set between a local run and CI is not a gate you can reason
  # about, and it is one more unreviewed package fetched into a build.
  lint:workflows:
    desc: Zizmor security scan over .github/ (needs uv/uvx on PATH)
    cmds:
      - uvx zizmor@1.29.0 --min-severity medium --config .github/zizmor.yml .github/

  secrets:
    desc: Scan the working tree and history for committed secrets
    cmds:
      - gitleaks detect --source . --redact

  audit:signatures:
    desc: Verify every resolved dependency's npm registry signature
    cmds:
      - npm audit signatures

  # dev:indexes / dev:catalog are STANDALONE, like quality:web — never part of
  # `verify`, which must stay runnable on the npm toolchain alone. dev:indexes
  # is also the one task here that needs a SECOND repository: it carves its
  # trees out of the sibling ocx-sh/index checkout (INDEX_REPO overrides the
  # path), deliberately, so no third-party package data is committed here.
  dev:indexes:
    desc: >-
      Seed .dev-indexes/ — carved multi-index trees plus one config per case
      (single-root, single-noroot, multi-root, multi-noroot, multi-noroot-default,
      multi-root-dev-excluded, many, and the two
      deliberately-invalid ones). Needs ../index checked out. `BULK=3000`
      clones the default index up to that many packages, for looking at the
      catalog at corporate size — then `task dev:catalog CASE=single-root`.
    cmds:
      - node scripts/dev-indexes.mjs {{if .BULK}}--bulk {{.BULK}}{{end}}

  dev:catalog:
    desc: >-
      Serve one seeded case with a real `ocx-catalog dev` — `task dev:catalog
      CASE=multi-root`. Run `task dev:indexes` first. The invalid-* cases are
      expected to FAIL to build; that is what they are for.
    # No default: CASE names which of nine quite different renders you get, and
    # silently picking one for you is how a review ends up looking at the wrong
    # case. `requires` makes task refuse and PRINT the accepted values, which is
    # the closest thing go-task has to a picker — `prompt:` is yes/no only, not
    # a value input. Keep this list in step with scripts/dev-indexes.mjs's
    # writeConfig calls; they are the files this resolves against.
    requires:
      vars:
        - name: CASE
          enum:
            - single-root
            - single-noroot
            - multi-root
            - multi-noroot
            - multi-noroot-default
            - multi-root-dev-excluded
            - many
            - invalid-prefix
            - invalid-collision
    cmds:
      - npm run build
      - node dist/cli/index.js dev --config .dev-indexes/{{.CASE}}.config.json

  # quality:web is STANDALONE — deliberately NOT part of `verify`. It builds the
  # committed fixture index at test/fixtures/quality-index/ into .lhci-site/,
  # which .lighthouserc.cjs points `staticDistDir` at, then asserts the measured
  # a11y/best-practices/SEO/perf floors.
  #
  # `npx lhci` runs the PINNED @lhci/cli devDependency out of node_modules/.bin
  # (never `npx --yes @lhci/cli`, which would fetch an unpinned copy at run
  # time). The two env vars below make a WSL shell behave like the Linux CI
  # runner; both are inert on CI. See scripts/lhci-posix-tmpdir.cjs for why
  # chrome-launcher's WSL branch otherwise writes Chrome profile directories
  # into the working tree.
  quality:web:
    desc: Build the fixture catalog site and run Lighthouse CI (a11y/SEO/perf)
    cmds:
      - npm run build
      - node dist/cli/index.js build --config test/fixtures/quality-index/catalog.config.json --out .lhci-site
      # CHROME_PATH: honour an explicit one, else fall back to a puppeteer-cached
      # Chrome if this machine has one. Empty on CI, where chrome-launcher finds
      # the runner's preinstalled google-chrome on its own.
      - >-
        CHROME_PATH="${CHROME_PATH:-$(ls -d "$HOME"/.cache/puppeteer/chrome/*/chrome-linux64/chrome 2>/dev/null | tail -1)}"
        NODE_OPTIONS="--require ./scripts/lhci-posix-tmpdir.cjs"
        npx lhci autorun
      # Same Chrome, second question: Lighthouse audits the page, this audits
      # the CONTRACT — that a consumer stylesheet can still override the theme.
      # Needs a real browser; happy-dom drops @layer and jsdom never applies it,
      # so a shim would pass whether or not the mechanism works.
      - >-
        node scripts/quality-css-cascade.mjs
        "${CHROME_PATH:-$(ls -d "$HOME"/.cache/puppeteer/chrome/*/chrome-linux64/chrome 2>/dev/null | tail -1)}"
      # Third question, and the one the six-package fixture cannot ask: what
      # does the catalog cost at the size a corporate mirror reaches? The
      # fixture is cloned to 250 packages in a scratch copy (nothing is written
      # back) and built into .lhci-bulk/, then audited for payload and measured
      # for the work of BUILDING a card or a row for every package — the half
      # a category score does not isolate and no DOM emulator can see.
      #
      # `BULK=3000` measures a larger catalog instead. The budgets and the
      # Lighthouse floors are set for 250, so a bigger run is for LOOKING at
      # the numbers, not for passing — the probe prints them either way.
      #
      # The bin path rather than `npx lhci` here: npm 11's `npx` claims
      # `--config` as its own flag and never hands it to lhci. Same pinned
      # binary, same node_modules/.bin, just not through npm's arg parser.
      - node scripts/quality-site.mjs --bulk {{.BULK | default "250"}}
      - >-
        CHROME_PATH="${CHROME_PATH:-$(ls -d "$HOME"/.cache/puppeteer/chrome/*/chrome-linux64/chrome 2>/dev/null | tail -1)}"
        NODE_OPTIONS="--require ./scripts/lhci-posix-tmpdir.cjs"
        ./node_modules/.bin/lhci autorun --config=.lighthouserc.bulk.cjs
      - >-
        node scripts/quality-view-switch.mjs
        "${CHROME_PATH:-$(ls -d "$HOME"/.cache/puppeteer/chrome/*/chrome-linux64/chrome 2>/dev/null | tail -1)}"

  # Regenerate CHANGELOG.md from the full git history.
  changelog:
    desc: Regenerate CHANGELOG.md from git history
    cmds:
      - git-cliff -o CHANGELOG.md

  # Show what would land in the next release's changelog section.
  changelog:preview:
    desc: Preview unreleased changes
    cmds:
      - git-cliff --unreleased

  # Full release preparation: compute the next version, write it into
  # package.json (no commit, no tag), regenerate CHANGELOG.md, run the gate.
  # After this succeeds the human reviews, then commits/tags/pushes manually —
  # this task never touches git.
  #
  # Version selection:
  #   task release:prepare BUMP=auto                 # git-cliff picks the bump from commits
  #   task release:prepare BUMP=minor                # force a bump level
  #   task release:prepare BUMP=auto VERSION=0.2.0   # pin an exact version (v prefix optional)
  #
  # BUMP is a required enum: with interactive mode (.taskrc.yml) and a TTY it
  # renders a selection menu; on CI / no TTY it must be passed on the CLI.
  release:prepare:
    desc: 'Prepare a release (BUMP=auto|patch|minor|major, optional VERSION=x.y.z)'
    requires:
      vars:
        - name: BUMP
          enum: [auto, patch, minor, major]
    vars:
      # git-cliff computes the next version from git history. `auto` lets it
      # pick the bump from conventional commits; otherwise BUMP forces the
      # level. VERSION pins an exact value and wins over BUMP.
      NEXT_VERSION:
        sh: |
          if [ -n "{{.VERSION}}" ]; then
            printf 'v%s' "{{.VERSION | default "" | trimPrefix "v"}}"
          elif [ "{{.BUMP}}" = "auto" ]; then
            git-cliff --bumped-version
          else
            git-cliff --bumped-version --bump "{{.BUMP}}"
          fi
    cmds:
      - echo "Next version:{{.NEXT_VERSION}}"
      - npm version "{{.NEXT_VERSION | trimPrefix "v"}}" --no-git-tag-version
      - git-cliff --tag "{{.NEXT_VERSION}}" -o CHANGELOG.md
      - task: verify
      - |
        echo ""
        echo "Release prepared ({{.NEXT_VERSION}}). Review the diff, then:"
        echo "  git add -A && git commit -m 'chore(release): {{.NEXT_VERSION}}'"
        echo "  git tag {{.NEXT_VERSION}}"
        echo "  git push --atomic origin main {{.NEXT_VERSION}}"
